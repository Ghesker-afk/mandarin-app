version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mandarin_postgres
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=mandarindb
    ports:
    - "5433:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - mandarin-net

  app:
      build: .
      container_name: mandarin_app
      ports:
        - "8081:8080"
      environment:
        - DB_HOST=postgres
        - DB_PORT=5432
        - DB_USER=postgres
        - DB_PASSWORD=postgres
        - DB_NAME=mandarindb
        - DB_SSLMODE=disable
        - SERVER_PORT=8080
      depends_on:
        - postgres
      networks:
        - mandarin-net

volumes:
  pgdata:

networks:
  mandarin-net:
    driver: bridge
