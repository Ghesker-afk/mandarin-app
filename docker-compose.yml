services:
  postgres:
    image: postgres:15-alpine
    container_name: mandarin_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mandarindb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mandarin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mandarindb"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: mandarin_app
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mandarindb
      DB_SSLMODE: disable
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mandarin-net

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database"
      - "postgres://postgres:postgres@postgres:5432/mandarindb?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mandarin-net

volumes:
  pgdata:

networks:
  mandarin-net:
    driver: bridge