version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mandarin_postgres
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=mandarindb
    ports:
    - "5433:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - mandarin-net

volumes:
  pgdata:

networks:
  mandarin-net:
    driver: bridge
